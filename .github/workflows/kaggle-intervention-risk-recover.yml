name: Recover queued Kaggle intervention-risk screen

on:
  push:
    branches: [research/decision-model-plan]
    paths: [.github/workflows/kaggle-intervention-risk-recover.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle==2.2.4
      - name: Collect the already-submitted private kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN missing from Actions secrets" >&2
            exit 1
          fi
          python analysis/kaggle_collect_intervention_risk_probe.py
      - name: Preserve recovered aggregate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-intervention-risk-probe-recovered
          path: results/kaggle-intervention-risk-probe.json
          if-no-files-found: ignore
