name: CLINC lexical development baseline

on:
  push:
    branches: [research/decision-model-plan]
    paths: [.github/workflows/clinc-lexical.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU baseline dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.7.2
      - name: Fit lexical control with locked test untouched
        run: python analysis/baseline_clinc.py
      - name: Preserve aggregate metrics and hashed prediction rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinc-lexical-baseline
          path: |
            results/clinc-lexical.json
            results/clinc-lexical-predictions.jsonl
          if-no-files-found: ignore
