name: ContractNLI author train and dev source audit

on:
  push:
    branches: [research/decision-model-plan]
    paths: [.github/workflows/contractnli-data-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit pinned author release without opening locked test
        run: python analysis/audit_contractnli.py
      - name: Preserve aggregate audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contractnli-data-audit
          path: results/contractnli-audit.json
          if-no-files-found: ignore
