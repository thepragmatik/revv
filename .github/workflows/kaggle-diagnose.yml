name: Kaggle GPU probe diagnostics

on:
  push:
    branches: [research/decision-model-plan]
    paths: [.github/workflows/kaggle-diagnose.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check kaggle==2.2.4
      - name: Read the first probe's Kaggle status and log
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          from kaggle import api
          import json
          import tempfile
          from pathlib import Path
          api.authenticate()
          reference = f'{api.config_values["username"]}/revv-gpu-smoke/1'
          response = api.kernels_status(reference)
          print(f'Status: {response.status}; failure: {response.failure_message}')
          try:
              with tempfile.TemporaryDirectory() as folder:
                  api.kernels_pull(reference, folder, metadata=True)
                  metadata = json.loads(next(Path(folder).rglob('kernel-metadata.json')).read_text())
                  print({key: metadata.get(key) for key in ('enable_gpu', 'machine_shape', 'is_private', 'enable_internet')})
          except Exception as error:
              print(f'Metadata unavailable: {type(error).__name__}: {error}')
          print('Last 8000 characters of kernel execution log:')
          print(api.kernels_logs(reference)[-8000:])
          PY
      - name: Check remaining accelerator quota
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle quota
        continue-on-error: true
