name: CLINC development similarity sensitivity

on:
  push:
    branches: [research/decision-model-plan]
    paths: [.github/workflows/clinc-similarity-sensitivity.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned lexical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.7.2
      - name: Check fixed near-template sensitivity on public development only
        run: python analysis/clinc_similarity_sensitivity.py
      - name: Preserve aggregate strata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinc-similarity-sensitivity
          path: results/clinc-similarity-sensitivity.json
          if-no-files-found: ignore
