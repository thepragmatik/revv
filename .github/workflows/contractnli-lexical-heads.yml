name: ContractNLI matched lexical decision heads

on:
  push:
    branches: [research/decision-model-plan]
    paths: [.github/workflows/contractnli-lexical-heads.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.7.2
      - name: Fit matched train-only lexical ternary heads with document-fold evidence retrieval
        run: python analysis/contractnli_lexical_heads.py
      - name: Preserve aggregate matched model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contractnli-lexical-heads
          path: results/contractnli-lexical-heads.json
          if-no-files-found: ignore
