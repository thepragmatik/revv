name: Kaggle GPU smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle==2.2.4
      - name: Run private, time-limited GPU probe
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN is missing from repository Actions secrets." >&2
            exit 1
          fi
          python analysis/kaggle_smoke.py
      - name: Save probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-smoke
          path: results/kaggle-smoke.json
          if-no-files-found: ignore
